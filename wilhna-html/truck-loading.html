<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Truck to Conveyor Loading Videos</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }

    .logo-main {
      width: 200px;
    }

    .logo-secondary {
      width: 140px;
    }

    video {
      width: 80%;
      max-width: 800px;
      margin: 40px 0;
    }

    @media (max-width: 600px) {
      .logo-container {
        flex-direction: column;
        gap: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <a href="https://www.wilhna.com" target="_blank">
      <img src="img/Logo_wilhelmina_Holland_WHITE.png" alt="Wilhelmina Logo" class="logo-main">
    </a>
    <a href="https://www.wilhna.com" target="_blank">
      <img src="img/logo_02.png" alt="TG2 Logo" class="logo-secondary">
    </a>
  </div>

  <h1>Truck bucket to conveyor loading</h1>
  <video controls controlsList="nodownload">
    <source src="videos/TrucktoConveyorLoading.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <h1>Double bucket conveyor for ship loading</h1>
  <video controls controlsList="nodownload">
    <source src="videos/TrucktoConveyorLoading_2.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
</body>
</html>
